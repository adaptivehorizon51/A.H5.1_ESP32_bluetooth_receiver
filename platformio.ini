[env:esp32dev]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 5242880
board_build.partitions = partitions_8MB_no_ota.csv
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.f_cpu = 240000000L

lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    https://github.com/pschatzmann/ESP32-A2DP/archive/refs/tags/v1.8.11.zip

build_flags = 
    ; --- CLASSIC BLUETOOTH A2DP ---
    -D CONFIG_BT_ENABLED=1
    ; Arduino-ESP32 sdkconfig hard-enables BLE support; BLE controller memory is released at runtime.
    -D CONFIG_BT_CLASSIC_ENABLED=1
    -D CONFIG_BT_DM_CTRL_MODE_BLE_ONLY=0
    -D CONFIG_BT_DM_CTRL_MODE_BR_EDR_ONLY=1
    -D CONFIG_BT_A2DP_ENABLE=1
    ; ESP32-A2DP v1.8.11 names the suspended state from newer IDF;
    ; Arduino-ESP32 2.0.17 (IDF 4.4.x) calls the same zero-valued state REMOTE_SUSPEND.
    -D ESP_A2D_AUDIO_STATE_SUSPEND=ESP_A2D_AUDIO_STATE_REMOTE_SUSPEND
    ; PCM and I2S are handled by AudioEngine.
    -D A2DP_I2S_AUDIOTOOLS=0
    ; TFT_eSPI touch is not fitted; silence its informational setup warning.
    -D DISABLE_ALL_LIBRARY_WARNINGS
    
    ; --- DISPLAY SETUP ---
    -D USER_SETUP_LOADED
    -D ST7735_DRIVER
    -D ST7735_GREENTAB3
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=128
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=2
    -D TFT_RST=4
    -D SPI_FREQUENCY=27000000
    -D LOAD_GLCD

monitor_filters = esp32_exception_decoder, time
